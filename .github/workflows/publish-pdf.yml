name: publish-pdf

# 把成品 PDF 发布到固定的下载位（Release: book-latest）。
#
# 为什么单独一个工作流、而不是并进 book.yml：
#   1. book.yml 的 PDF 是**构建器现场生成**的（weasyprint 吃 print.html），
#      每个 h1/h2/h3 强制另起一页，条目页大量留白。
#      成品（董老师 2026-10-09 裁定的版式：全书不分页、封面左对齐，A4 / 269 页 /
#      中文字体已嵌入）观感与页数都更好，是董老师确认要发出去的那一版。
#   2. book.yml 同时负责站点与单文件 HTML 的发布，那两项另有负责人；
#      本工作流的触发路径**刻意避开**它的白名单，只动 PDF 这一个下载位，互不牵连。
#      （2026-10-09 事故：book.yml 侧一度也上传 dist/HKStudyGuide.pdf 抢同一资产名，
#        把成品版覆盖；现已摘除，并加 workflow_run 自愈。）
#
# 触发：把新的成品 PDF 覆盖到 download/董老师香港留学指南.pdf 后 push，即自动发布。
# 也可在 Actions 页手动 Run workflow。
#
# 下载地址（永久不变，始终指向最新版）：
#   https://github.com/kk2688qq/dong-hk-guide/releases/download/book-latest/HKStudyGuide.pdf
#
# 为什么资产名不用中文：GitHub 会把含非 ASCII 字符的附件名统一改写成 default.<ext>，
# 中文名传上去只会得到 default.pdf（不可读、且与其它项目撞名）。仓库内的文件名保持
# 中文（对外统一名），Release 资产名固定英文。

on:
  push:
    branches: [main]
    paths:
      - "download/**"
      - ".github/workflows/publish-pdf.yml"
  # 自愈：build-book 跑完（无论成功与否）再落一次位。
  # 起因见 2026-10-09 的事故——build-book 的 Release 步骤曾把 dist/HKStudyGuide.pdf
  # 一起上传，与本工作流抢同一资产名且通常后完成，把成品 PDF 覆盖成 weasyprint 现场版。
  # 现在 book.yml 侧已摘掉 PDF，这里再加一道保险：只要构建结束，成品 PDF 总会回到发布位。
  workflow_run:
    workflows: ["build-book"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pdf
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验来源文件（存在、非空、是 PDF）
        run: |
          set -euo pipefail
          ls -lh download/
          SRC="download/董老师香港留学指南.pdf"
          test -s "$SRC" || { echo "::error::缺少成品 PDF：$SRC"; exit 1; }
          head -c 5 "$SRC" | grep -q '%PDF-' || { echo "::error::$SRC 不是合法 PDF"; exit 1; }
          echo "OK  $SRC  $(du -h "$SRC" | cut -f1)"

      - name: 备好发布用的文件名
        # ⚠️ Release 附件名只能是 ASCII：GitHub 官方说明「会把含特殊字符、非字母数字、
        # 首尾句点的资产名改名」，实测中文名一律变成 default.<ext>（本 Release 里
        # 已有的 default.md 就是同一原因——构建流程上传的是中文名的台账文件）。
        # 因此仓库内保留中文名（判例 27 的对外统一名），Release 资产固定用历史英文名，
        # 下载链接与读者拿到的文件名保持 HKStudyGuide.pdf。
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "download/董老师香港留学指南.pdf" "dist/HKStudyGuide.pdf"
          ls -lh dist/

      - name: 发布到固定 Release（book-latest，同名覆盖）
        # 只替换 PDF 资产，不触碰 Release 的说明文字与其它产物（HTML / EPUB / 台账）。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload book-latest "dist/HKStudyGuide.pdf" --clobber
          # 清掉此前尝试中文名时被 GitHub 退化成名的占位资产（无则跳过）
          gh release delete-asset book-latest default.pdf --yes || true

      - name: 回执（列出发布位最终资产，便于核对）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## PDF 已发布到 book-latest"
            echo
            echo "- 来源：\`download/董老师香港留学指南.pdf\`（$(du -h dist/HKStudyGuide.pdf | cut -f1)）"
            echo "- 下载（永久指向最新版）：https://github.com/${{ github.repository }}/releases/download/book-latest/HKStudyGuide.pdf"
            echo
            echo "### 该 Release 当前资产"
            gh release view book-latest --json assets \
              --jq '.assets[] | "- `\(.name)` — \(.size) B"'
          } >> "$GITHUB_STEP_SUMMARY"
