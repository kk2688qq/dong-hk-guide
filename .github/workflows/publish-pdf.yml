name: publish-pdf

# 把成品 PDF 发布到固定的下载位（Release: book-latest）。
#
# 为什么单独一个工作流、而不是并进 book.yml：
#   1. book.yml 的 PDF 是**构建器现场生成**的（weasyprint 吃 print.html）。
#      成品（A4 / 191 页 / 中文字体已嵌入）观感与页数都更好，是董老师确认要发出去的那一版。
#   2. book.yml 同时负责站点与单文件 HTML 的发布，那两项另有负责人；
#      本工作流的触发路径**刻意避开**它的白名单，只动 PDF 这一个下载位，互不牵连。
#
# 触发：把新的成品 PDF 覆盖到 download/董老师香港留学指南.pdf 后 push，即自动发布。
# 也可在 Actions 页手动 Run workflow。
#
# 下载地址（永久不变，始终指向最新版）：
#   https://github.com/kk2688qq/dong-hk-guide/releases/download/book-latest/董老师香港留学指南.pdf

on:
  push:
    branches: [main]
    paths:
      - "download/**"
      - ".github/workflows/publish-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-pdf
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 校验来源文件（存在、非空、是 PDF）
        run: |
          set -euo pipefail
          ls -lh download/
          SRC="download/董老师香港留学指南.pdf"
          test -s "$SRC" || { echo "::error::缺少成品 PDF：$SRC"; exit 1; }
          head -c 5 "$SRC" | grep -q '%PDF-' || { echo "::error::$SRC 不是合法 PDF"; exit 1; }
          echo "OK  $SRC  $(du -h "$SRC" | cut -f1)"

      - name: 备好两个文件名（正式中文名 + README 现用英文名）
        # 中文名是项目对外统一名；英文名 HKStudyGuide.pdf 仍被 README / llms.txt 引用，
        # 两份内容完全相同，避免读者从旧链接下到过时版本。待上游链接全部切到中文名后，
        # 可移除此处英文名并行发布。
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "download/董老师香港留学指南.pdf" "dist/董老师香港留学指南.pdf"
          cp "download/董老师香港留学指南.pdf" "dist/HKStudyGuide.pdf"
          ls -lh dist/

      - name: 发布到固定 Release（book-latest，同名覆盖）
        # 只替换 PDF 资产，不触碰 Release 的说明文字与其它产物（HTML / EPUB / 台账）。
        # 中文资产名走 REST API 并显式百分号编码：gh CLI 遇到非 ASCII 名会退化成
        # default.<ext>（首次发布实测如此），生成的下载链接会变成不可读的 default.pdf。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/$REPO"
          REL_ID=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                   "$API/releases/tags/book-latest" | jq -r '.id')
          echo "release id = $REL_ID"

          upload() {
            local file="$1" name="$2" aid enc
            aid=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "$API/releases/$REL_ID/assets?per_page=100" \
                  | jq -r --arg n "$name" '.[] | select(.name==$n) | .id' | head -1)
            if [ -n "$aid" ]; then
              curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "$API/releases/assets/$aid" >/dev/null
              echo "  删除旧资产：$name (id=$aid)"
            fi
            enc=$(jq -rn --arg s "$name" '$s|@uri')
            curl -fsSL -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: application/octet-stream" \
              --data-binary @"$file" \
              "https://uploads.github.com/repos/$REPO/releases/$REL_ID/assets?name=$enc" \
              | jq -r '"  已上传：" + .name + "  " + (.size|tostring) + " B"'
          }

          upload "dist/董老师香港留学指南.pdf" "董老师香港留学指南.pdf"
          upload "dist/HKStudyGuide.pdf" "HKStudyGuide.pdf"

          # 清理早期用 gh CLI 上传时退化成名的占位资产
          for junk in default.pdf; do
            jid=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                    "$API/releases/$REL_ID/assets?per_page=100" \
                  | jq -r --arg n "$junk" '.[] | select(.name==$n) | .id' | head -1)
            [ -z "$jid" ] || { curl -fsSL -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                "$API/releases/assets/$jid" >/dev/null; echo "  清理占位资产：$junk"; }
          done

      - name: 回执（列出发布位最终资产，便于核对）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "## PDF 已发布到 book-latest"
            echo
            echo "- 来源：\`download/董老师香港留学指南.pdf\`（$(du -h "dist/董老师香港留学指南.pdf" | cut -f1)）"
            echo "- 下载（永久指向最新版）："
            echo "  - https://github.com/${{ github.repository }}/releases/download/book-latest/董老师香港留学指南.pdf"
            echo "  - https://github.com/${{ github.repository }}/releases/download/book-latest/HKStudyGuide.pdf"
            echo
            echo "### 该 Release 当前资产"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/book-latest" \
              | jq -r '.assets[] | "- `\(.name)` — \(.size) B"'
          } >> "$GITHUB_STEP_SUMMARY"
