name: build-book

on:
  push:
    branches: [main]
    paths: ["book/**", "meta/**", "docs/**", "README.md", ".github/workflows/book.yml"]
  workflow_dispatch:
  # 手动触发：python tools/check.py --only links --network（链接巡检需要网络）

permissions:
  contents: write
  # GitHub Pages 部署（WB4-021「开 GitHub Pages」/ 董老师已定）：
  # deploy-pages 需要 pages: write 写入部署，并需 id-token: write 换 OIDC token。
  pages: write
  id-token: write

concurrency:
  group: build-book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (pandoc + CJK fonts + weasyprint)
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk
          pip3 install weasyprint
          pandoc --version | head -1

      - name: Quality check (reports only, never blocks the build)
        # 刻意不挡发布：门禁只管新增内容的质量，不管已发布内容的可用性。
        # 详见 CLAUDE.md 第五节与 tools/check.py 头部说明。
        run: |
          python3 tools/check.py || true

      - name: Sync README from book/ (017 阶段 1「止血」)
        # 消灭「README 说 3 条、实际 18 条」这类漂移：README 的条数/等级/目录
        # 由 tools/readme_sync.py 依 book/ 实际内容回填并回提交（判据见脚本头部）。
        # 用 GITHUB_TOKEN 的提交不会再触发工作流，故不会自激循环。
        run: |
          set -euo pipefail
          python3 tools/readme_sync.py
          if ! git diff --quiet README.md llms.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md llms.txt
            git commit -m "chore(readme,llms): 自动回填目录、条数与 AI 可读层 [skip ci]"
            git push
          else
            echo "README / llms.txt 已同步，无需回填"
          fi

      - name: Stamp document header (版本号 + 引用格式) (017 阶段 2)
        # 产物（HTML/PDF/EPUB）页首插「文档信息 + 建议引用格式 + 版本号」——
        # 让 AI / 读者拿到文件即知版本与出处，属「AI 可读层」的零成本部分。
        run: |
          set -euo pipefail
          mkdir -p dist
          VERSION="$(date -u +%Y-%m-%d)"
          N="$(ls book/*.md | wc -l | tr -d ' ')"
          SHA="$(git rev-parse --short HEAD)"
          {
            echo "# 董老师香港留学指南"
            echo ""
            echo "> **文档信息**：版本 ${VERSION}（构建 ${SHA}）· 共 ${N} 条 · 许可 CC BY-NC-SA 4.0 · 开源仓库 https://github.com/kk2688qq/dong-hk-guide"
            echo ">"
            echo "> **建议引用格式**：董老师. 《董老师香港留学指南》. ${VERSION}. https://github.com/kk2688qq/dong-hk-guide"
            echo ">"
            echo "> 本文档每一条都可点开条目末尾的**官方原文链接**自行核对；核实记录公开在仓库 \`docs/核实记录/\`。"
            echo ""
            echo "---"
            echo ""
          } > dist/head.md
          cat dist/head.md

      - name: Merge chapters by number
        run: |
          set -euo pipefail
          mkdir -p dist
          : > dist/full.md
          # 页首：文档信息 + 建议引用格式 + 版本号（017 阶段 2）
          if [ -s dist/head.md ]; then
            cat dist/head.md >> dist/full.md
            echo "prepended: dist/head.md（文档信息页首）"
          fi
          count=0
          # 前置章节（开篇 / 术语表 / 证据分级 / 使用方法 / 免责声明）——WB4-021 第 3 项。
          # 目的是让产物从「一堆条目」变成「一本书」：读者先看到「这本书想回答的问题」。
          # 文件在 meta/ 下、**不在 book/ 中**，因此不参与条目 schema 质检。
          for f in $(ls meta/front-*.md 2>/dev/null | LC_ALL=C sort); do
            printf '\n\n<!-- ===== %s ===== -->\n\n' "$f" >> dist/full.md
            cat "$f" >> dist/full.md
            echo "prepended: $f（前置章节）"
          done
          # 用 LC_ALL=C 保证按字节序排序 == 按编号排序（001/002/003…）
          while IFS= read -r f; do
            printf '\n\n<!-- ===== %s ===== -->\n\n' "$f" >> dist/full.md
            cat "$f" >> dist/full.md
            count=$((count + 1))
          done < <(ls book/*.md | LC_ALL=C sort)
          # 页脚（作者 + 联系方式 + 免责 + 版权）并入正文，
          # 确保单独下载 PDF/HTML/EPUB 的读者也能找到作者与联系方式。
          # 该文件不在 book/ 下，因此不参与条目 schema 质检。
          if [ -s meta/about.md ]; then
            printf '\n\n<!-- ===== meta/about.md ===== -->\n\n' >> dist/full.md
            cat meta/about.md >> dist/full.md
            echo "appended: meta/about.md（页脚）"
          else
            echo "::warning::meta/about.md 缺失，产物将不含作者与联系方式"
          fi
          # 附录：公开纠错台账（017 阶段 3）——让 AI 与读者在**单文件产物**里
          # 也能读到「这份内容被质疑过、核查过、修正过」。放在页脚之后。
          # 该文件不在 book/ 下，因此不参与条目 schema 质检。
          if [ -s docs/纠错台账.md ]; then
            printf '\n\n<!-- ===== docs/纠错台账.md ===== -->\n\n' >> dist/full.md
            cat docs/纠错台账.md >> dist/full.md
            echo "appended: docs/纠错台账.md（附录·纠错台账）"
          else
            echo "::warning::docs/纠错台账.md 缺失，产物将不含纠错台账"
          fi
          echo "merged: $count chapters"
          if [ "$count" -eq 0 ]; then
            echo "::error::book/ 目录里没有任何条目，构建终止"
            exit 1
          fi

      - name: Write stylesheet
        run: |
          cat > dist/style.html <<'EOF'
          <style>
          body{max-width:760px;margin:0 auto;padding:24px 18px;
               font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
               line-height:1.85;color:#1a1a1a;background:#fff}
          h1{font-size:1.7em;line-height:1.35;margin:0 0 .2em}
          h2{font-size:1.28em;margin-top:2em;border-bottom:1px solid #e6e6e6;padding-bottom:.3em}
          h3{font-size:1.08em;margin-top:1.5em}
          table{border-collapse:collapse;width:100%;margin:1.2em 0;font-size:.92em}
          th,td{border:1px solid #ddd;padding:8px 10px;text-align:left;vertical-align:top}
          th{background:#f6f7f9;font-weight:500}
          tr:nth-child(even) td{background:#fafbfc}
          blockquote{margin:1.2em 0;padding:.6em 1em;border-left:3px solid #d0d4da;
                     background:#f7f8fa;color:#444}
          code{background:#f2f3f5;padding:.1em .35em;border-radius:3px;font-size:.9em}
          a{color:#0b5cad;text-decoration:none}
          hr{border:0;border-top:1px solid #e6e6e6;margin:2.2em 0}
          @media (prefers-color-scheme:dark){
            body{color:#e8e8e8;background:#16181c}
            th{background:#22252b}tr:nth-child(even) td{background:#1b1e23}
            blockquote{background:#1b1e23;color:#ccc;border-left-color:#3a3f47}
            code{background:#22252b}hr{border-top-color:#2c3038}th,td{border-color:#2c3038}
            a{color:#6db3f2}}
          </style>
          EOF

      - name: Build single-file HTML
        run: |
          pandoc dist/full.md \
            --standalone --toc --toc-depth=2 \
            --metadata title="董老师香港升学手册" \
            --metadata lang="zh-HK" \
            --include-in-header=dist/style.html \
            -o dist/HKStudyGuide.html

      - name: Build EPUB
        run: |
          pandoc dist/full.md \
            --toc --toc-depth=2 \
            --metadata title="董老师香港升学手册" \
            --metadata lang="zh-HK" \
            -o dist/HKStudyGuide.epub

      - name: Build PDF (weasyprint)
        run: |
          # weasyprint 需要能取到 dist/style.html
          python3 -m weasyprint \
            -s dist/style.html \
            dist/HKStudyGuide.html dist/HKStudyGuide.pdf \
            || echo "::warning::PDF 构建失败，HTML/EPUB 不受影响"

      - name: Verify outputs exist and are non-trivial
        run: |
          set -euo pipefail
          fail=0
          for f in dist/HKStudyGuide.html dist/HKStudyGuide.epub; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产物 $f"; fail=1
            else
              echo "OK  $f  $(du -h "$f" | cut -f1)"
            fi
          done
          # PDF 允许缺失（weasyprint 可能失败），但若存在则必须非空
          if [ -s dist/HKStudyGuide.pdf ]; then
            echo "OK  dist/HKStudyGuide.pdf  $(du -h dist/HKStudyGuide.pdf | cut -f1)"
          else
            echo "::warning::PDF 未产出（可接受，HTML/EPUB 已覆盖主要场景）"
          fi
          exit $fail

      - name: Upload dist（供 pages 任务下载）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload to fixed release (book-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book-latest
          name: book-latest
          body: |
            自动构建于 ${{ github.event.head_commit.timestamp }}。
            **下载链接永久不变，始终指向最新版。**
          files: |
            dist/HKStudyGuide.html
            dist/HKStudyGuide.epub
            dist/HKStudyGuide.pdf
            docs/纠错台账.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- 站点（路径二）
  # WB4-021 第 1 项 / 董老师已定：开 GitHub Pages，让 llms.txt、robots.txt 在
  # **自有域名根**生效，AI 联网检索可命中（此前它们在 GitHub 仓库根对
  # raw.githubusercontent.com 不产生作用）。
  #
  # 为什么用工作流而不是去点 Settings → Pages：
  #   本机没有 gh CLI、也没有可用的 PAT，无法改仓库设置；
  #   actions/configure-pages 的 `enablement: true` 可由 CI 用工作流令牌
  #   **自动开启 Pages**（Source 置为 GitHub Actions），效果等价的自动化路径。
  #   若某天要做成「main 分支根目录」源，在 Pages 设置里改一次即可，本工作流照常可跑。
  #
  #   ✅ 2026-10-07：董老师已在仓库 Settings → Pages 把 Source 置为「GitHub Actions」，
  #   本工作流自此每次 push 自动构建并部署站点；本提交即为开通后的首次生效触发。
  #
  # 刻意 continue-on-error：**Pages 开启或部署失败不得影响单文件版发布**
  # （与 check.py 的设计原则一致：门禁只管新增内容的质量，不挡既有内容的可用性）。
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # 可选的兜底令牌：若仓库管理员在 Secrets 里放了含 Pages 写权限的 PAT，
      # 本工作流会自动用它**创建** Pages 站点（GITHUB_TOKEN 无此权限，见下）。
      # secrets 上下文在 step 的 if 里不可用，故经 job 级 env 传递。
      GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install site deps
        run: pip3 install markdown

      - name: Build site (tools/build_site.py)
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SITE_BOOK_HTML: dist/HKStudyGuide.html
        run: |
          python3 tools/build_site.py
          echo "--- site 产物 ---"
          ls -la site | head -20
          test -s site/index.html
          test -s site/llms.txt
          test -s site/robots.txt

      - name: Configure Pages（① 默认令牌）
        # ⚠️ 结论（2026-10-07 实测 + 查证）：**创建 Pages 站点是仓库管理操作，
        # Actions 的 GITHUB_TOKEN 按设计永远无权执行**——actions/configure-pages 的
        # enablement 输入官方说明即「requires a token **other than GITHUB_TOKEN**」。
        # 因此 `enablement: true` 在只用默认令牌时必失败（Resource not accessible by
        # integration），本轮两次 CI 都卡在这一步。
        # 这一步**不带 enablement**：站点已开启时它读一下即通过；未开启时会 404 失败，
        # 由下面的兜底与警示步骤接住，**不让它变成长期红叉、也不挡单文件发布**。
        id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Configure Pages（② 兜底：GH_PAGES_TOKEN，若已配置则自动创建站点）
        id: cfg_pat
        if: steps.cfg.outcome != 'success' && env.GH_PAGES_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ env.GH_PAGES_TOKEN }}

      - name: Upload Pages artifact
        if: steps.cfg.outcome == 'success' || steps.cfg_pat.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.cfg.outcome == 'success' || steps.cfg_pat.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: 未开启 Pages → 出一份可执行的 Summary 与警示（不失败）
        if: steps.cfg.outcome != 'success' && steps.cfg_pat.outcome != 'success'
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## ⚠️ 站点未部署：GitHub Pages 尚未开启

          **一次性动作（约 30 秒，需仓库管理员）**

          > **Settings → Pages → Build and deployment → Source 选「GitHub Actions」→ Save**

          做完这一次，本工作流**每次 push 都会自动构建并部署**，不需要再碰任何设置。
          站点地址：`https://<owner>.github.io/<repo>/`（本项目为
          `https://kk2688qq.github.io/dong-hk-guide/`）。

          **为什么 CI 自己开不了**：创建 Pages 站点属于**仓库管理操作**，
          Actions 自动颁发的 `GITHUB_TOKEN` **按设计永远没有这个权限**——
          `actions/configure-pages` 的 `enablement` 输入官方说明即
          「requires a token **other than `GITHUB_TOKEN`** to be provided」。
          所以本轮两次 CI 都卡在这一步，加任何 `permissions:` 都无效。

          **不想用界面？** 也可在仓库加一个含 Pages 写权限的 PAT 存为 secret
          `GH_PAGES_TOKEN`，本工作流的兜底步骤会自动用它创建站点。

          ---
          **本次已完成的部分**：站点已构建成功（见上一步产物），
          `llms.txt` / `llms-full.txt` / `robots.txt` / `sitemap.xml` 均已生成，
          **只等这一次开启**。
          MD
          echo "::warning title=需一次性开启 GitHub Pages::Settings → Pages → Source 选「GitHub Actions」（约 30 秒），之后全自动。详见本次运行 Summary。"
