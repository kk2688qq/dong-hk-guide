name: build-book

on:
  push:
    branches: [main]
    # tools/** 必须在白名单里：site/index.html（读者视图）与 Release 单文件
    # 都由 tools/build_reader.py 现场生成——只改生成器不改正文时，同样要重新构建。
    # 此前漏了它，2026-10-07 改版式时发现：推了生成器 CI 却不跑，站点不更新。
    paths: ["book/**", "meta/**", "docs/**", "tools/**", "release/**", "README.md", ".github/workflows/book.yml"]
  workflow_dispatch:
  # 手动触发：python tools/check.py --only links --network（链接巡检需要网络）

permissions:
  contents: write
  # GitHub Pages 部署（WB4-021「开 GitHub Pages」/ 董老师已定）：
  # deploy-pages 需要 pages: write 写入部署，并需 id-token: write 换 OIDC token。
  pages: write
  id-token: write

concurrency:
  group: build-book
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain (CJK fonts + weasyprint + pypandoc)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          pip3 install weasyprint markdown pypandoc-binary

      - name: Quality check (reports only, never blocks the build)
        # 刻意不挡发布：门禁只管新增内容的质量，不管已发布内容的可用性。
        # 详见 CLAUDE.md 第五节与 tools/check.py 头部说明。
        run: |
          python3 tools/check.py || true

      - name: Sync README from book/ (017 阶段 1「止血」)
        # 消灭「README 说 3 条、实际 18 条」这类漂移：README 的条数/等级/目录
        # 由 tools/readme_sync.py 依 book/ 实际内容回填并回提交（判据见脚本头部）。
        # 用 GITHUB_TOKEN 的提交不会再触发工作流，故不会自激循环。
        run: |
          set -euo pipefail
          python3 tools/readme_sync.py
          if ! git diff --quiet README.md llms.txt; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md llms.txt
            git commit -m "chore(readme,llms): 自动回填目录、条数与 AI 可读层 [skip ci]"
            git push
          else
            echo "README / llms.txt 已同步，无需回填"
          fi

      - name: "Guard: book/ 与定稿一致性（sync_from_draft --check，只报不挡）"
        # 2026-10-08 董老师定：发布件一律以定稿为准（release/定稿-董老师香港留学指南.md）。
        # book/ 若与定稿漂移，只警告不拦构建——门禁不挡既有内容的可用性。
        run: |
          python3 tools/sync_from_draft.py --check \
            || echo "::warning::book/ 与定稿不一致——产物仍按定稿出，请尽快 sync_from_draft.py --write 对齐"

      - name: Build release files（定稿直出：HTML + EPUB + 打印版 print.html）
        # 定稿本身是完整成书稿（封面/五部分/49 条/93 处分页符），不再重新拼装。
        # 结构性差异（此前 CI 拼的 head.md + 按「读者章」重排）已废弃。
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 tools/build_release.py --out dist --html --epub
          test -s dist/HKStudyGuide.html
          test -s dist/HKStudyGuide.epub
          test -s dist/print.html

      - name: Build PDF (weasyprint，与 HTML 同一 print.html 源)
        run: |
          python3 -m weasyprint dist/print.html dist/HKStudyGuide.pdf \
            || echo "::warning::PDF 构建失败，HTML/EPUB 不受影响"

      - name: Verify outputs exist and are non-trivial
        run: |
          set -euo pipefail
          fail=0
          for f in dist/HKStudyGuide.html dist/HKStudyGuide.epub; do
            if [ ! -s "$f" ]; then
              echo "::error::缺少产物 $f"; fail=1
            else
              echo "OK  $f  $(du -h "$f" | cut -f1)"
            fi
          done
          # PDF 允许缺失（weasyprint 可能失败），但若存在则必须非空
          if [ -s dist/HKStudyGuide.pdf ]; then
            echo "OK  dist/HKStudyGuide.pdf  $(du -h dist/HKStudyGuide.pdf | cut -f1)"
          else
            echo "::warning::PDF 未产出（可接受，HTML/EPUB 已覆盖主要场景）"
          fi
          exit $fail

      - name: Upload dist（供 pages 任务下载）
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

      - name: Upload to fixed release (book-latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: book-latest
          name: book-latest
          body: |
            自动构建于 ${{ github.event.head_commit.timestamp }}。
            **下载链接永久不变，始终指向最新版。**
          files: |
            dist/HKStudyGuide.html
            dist/HKStudyGuide.epub
            dist/HKStudyGuide.pdf
            docs/纠错台账.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------- 站点（路径二）
  # WB4-021 第 1 项 / 董老师已定：开 GitHub Pages，让 llms.txt、robots.txt 在
  # **自有域名根**生效，AI 联网检索可命中（此前它们在 GitHub 仓库根对
  # raw.githubusercontent.com 不产生作用）。
  #
  # 为什么用工作流而不是去点 Settings → Pages：
  #   本机没有 gh CLI、也没有可用的 PAT，无法改仓库设置；
  #   actions/configure-pages 的 `enablement: true` 可由 CI 用工作流令牌
  #   **自动开启 Pages**（Source 置为 GitHub Actions），效果等价的自动化路径。
  #   若某天要做成「main 分支根目录」源，在 Pages 设置里改一次即可，本工作流照常可跑。
  #
  #   ✅ 2026-10-07：董老师已在仓库 Settings → Pages 把 Source 置为「GitHub Actions」，
  #   本工作流自此每次 push 自动构建并部署站点；本提交即为开通后的首次生效触发。
  #
  # 刻意 continue-on-error：**Pages 开启或部署失败不得影响单文件版发布**
  # （与 check.py 的设计原则一致：门禁只管新增内容的质量，不挡既有内容的可用性）。
  pages:
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # 可选的兜底令牌：若仓库管理员在 Secrets 里放了含 Pages 写权限的 PAT，
      # 本工作流会自动用它**创建** Pages 站点（GITHUB_TOKEN 无此权限，见下）。
      # secrets 上下文在 step 的 if 里不可用，故经 job 级 env 传递。
      GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install site deps
        run: pip3 install markdown

      - name: Build site (tools/build_site.py)
        env:
          SITE_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SITE_BOOK_HTML: dist/HKStudyGuide.html
        run: |
          python3 tools/build_site.py
          # 首页换成「读者视图」（与 Release 里那份可下载 HTML 同一个阅读器）：
          # 卡片 + 说人话为主角 + 折叠明细 + 筛选；条目页 entry-HK-*.html 保留，
          # 深链不失效。build_site 出的旧 index.html 被这一步覆盖。
          python3 tools/build_reader.py --out site --name index.html
          echo "--- site 产物 ---"
          ls -la site | head -20
          test -s site/index.html
          test -s site/llms.txt
          test -s site/robots.txt

      - name: Configure Pages（① 默认令牌）
        # ⚠️ 结论（2026-10-07 实测 + 查证）：**创建 Pages 站点是仓库管理操作，
        # Actions 的 GITHUB_TOKEN 按设计永远无权执行**——actions/configure-pages 的
        # enablement 输入官方说明即「requires a token **other than GITHUB_TOKEN**」。
        # 因此 `enablement: true` 在只用默认令牌时必失败（Resource not accessible by
        # integration），本轮两次 CI 都卡在这一步。
        # 这一步**不带 enablement**：站点已开启时它读一下即通过；未开启时会 404 失败，
        # 由下面的兜底与警示步骤接住，**不让它变成长期红叉、也不挡单文件发布**。
        id: cfg
        uses: actions/configure-pages@v5
        continue-on-error: true

      - name: Configure Pages（② 兜底：GH_PAGES_TOKEN，若已配置则自动创建站点）
        id: cfg_pat
        if: steps.cfg.outcome != 'success' && env.GH_PAGES_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ env.GH_PAGES_TOKEN }}

      - name: Upload Pages artifact
        if: steps.cfg.outcome == 'success' || steps.cfg_pat.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        if: steps.cfg.outcome == 'success' || steps.cfg_pat.outcome == 'success'
        uses: actions/deploy-pages@v4

      - name: 未开启 Pages → 出一份可执行的 Summary 与警示（不失败）
        if: steps.cfg.outcome != 'success' && steps.cfg_pat.outcome != 'success'
        run: |
          set -euo pipefail
          cat >> "$GITHUB_STEP_SUMMARY" <<'MD'
          ## ⚠️ 站点未部署：GitHub Pages 尚未开启

          **一次性动作（约 30 秒，需仓库管理员）**

          > **Settings → Pages → Build and deployment → Source 选「GitHub Actions」→ Save**

          做完这一次，本工作流**每次 push 都会自动构建并部署**，不需要再碰任何设置。
          站点地址：`https://<owner>.github.io/<repo>/`（本项目为
          `https://kk2688qq.github.io/dong-hk-guide/`）。

          **为什么 CI 自己开不了**：创建 Pages 站点属于**仓库管理操作**，
          Actions 自动颁发的 `GITHUB_TOKEN` **按设计永远没有这个权限**——
          `actions/configure-pages` 的 `enablement` 输入官方说明即
          「requires a token **other than `GITHUB_TOKEN`** to be provided」。
          所以本轮两次 CI 都卡在这一步，加任何 `permissions:` 都无效。

          **不想用界面？** 也可在仓库加一个含 Pages 写权限的 PAT 存为 secret
          `GH_PAGES_TOKEN`，本工作流的兜底步骤会自动用它创建站点。

          ---
          **本次已完成的部分**：站点已构建成功（见上一步产物），
          `llms.txt` / `llms-full.txt` / `robots.txt` / `sitemap.xml` 均已生成，
          **只等这一次开启**。
          MD
          echo "::warning title=需一次性开启 GitHub Pages::Settings → Pages → Source 选「GitHub Actions」（约 30 秒），之后全自动。详见本次运行 Summary。"
